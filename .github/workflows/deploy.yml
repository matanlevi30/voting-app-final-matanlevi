name: deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "infra/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "infra/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_VERSION: "1.16.6"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -no-color

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false -no-color

      - name: terraform validate
        run: terraform validate -no-color

  build:
    name: build ${{ matrix.service }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, result, worker]
    env:
      REPOSITORY: ${{ vars.NAME_PREFIX }}-${{ matrix.service }}
      IMAGE_TAG: ${{ github.sha }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Does the tag already exist?
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "Tag $IMAGE_TAG already in $REPOSITORY, skipping the build"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build (and push on main)
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          provenance: false
          push: ${{ env.PUSH }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Pull Request: plan dev and prod. Never apply.
  plan:
    name: plan
    if: github.event_name == 'pull_request'
    needs: checks
    strategy:
      matrix:
        env: [dev, prod]
    uses: ./.github/workflows/terraform.yml
    with:
      env: ${{ matrix.env }}
      mode: plan
      image_tag: ${{ github.sha }}

  # Push to main: dev by itself, then prod after a human approves
  deploy-dev:
    name: dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/terraform.yml
    with:
      env: dev
      mode: deploy
      image_tag: ${{ github.sha }}

  deploy-prod:
    name: prod
    needs: deploy-dev
    uses: ./.github/workflows/terraform.yml
    with:
      env: prod
      mode: deploy
      image_tag: ${{ github.sha }}