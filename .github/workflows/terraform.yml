name: terraform

on:
  workflow_call:
    inputs:
      env:
        description: dev or prod
        type: string
        required: true
      mode:
        description: plan (Pull Request) or deploy (push to main)
        type: string
        required: true
      image_tag:
        description: Tag of the images in ECR (the git commit SHA)
        type: string
        required: true

env:
  AWS_REGION: eu-north-1
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"
  TF_ENV: ${{ inputs.env }}
  TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
  TF_VAR_image_tag: ${{ inputs.image_tag }}

jobs:
  plan:
    name: plan ${{ inputs.env }}
    if: inputs.mode == 'plan'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: >
          terraform init -input=false -no-color
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=voting-app/${TF_ENV}/terraform.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="use_lockfile=true"

      # A plan never writes the state, so it does not take the lock:
      # it must not block (or be blocked by) a deploy that is running
      - name: terraform plan
        run: terraform plan -input=false -no-color -lock=false -var-file="envs/${TF_ENV}.tfvars"

  deploy:
    name: deploy ${{ inputs.env }}
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    concurrency:
      group: terraform-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: >
          terraform init -input=false -no-color
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=voting-app/${TF_ENV}/terraform.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="use_lockfile=true"

      - name: terraform apply
        run: terraform apply -auto-approve -input=false -no-color -var-file="envs/${TF_ENV}.tfvars"

      - name: smoke test
        run: |
          VOTE_URL=$(terraform output -raw vote_url)
          RESULT_URL=$(terraform output -raw result_url)
          for url in "$VOTE_URL/healthz" "$RESULT_URL/healthz"; do
            echo "GET $url"
            status=$(curl --fail --silent --show-error --output /dev/null --write-out "%{http_code}" \
              --retry 10 --retry-delay 6 --retry-all-errors "$url")
            if [ "$status" != "200" ]; then
              echo "::error::$url answered $status"
              exit 1
            fi
            echo "-> $status"
          done

      - name: version check
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -no-color -var-file="envs/${TF_ENV}.tfvars"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "No changes: ${TF_ENV} runs image tag ${TF_VAR_image_tag}"
            exit 0
          fi
          if [ "$code" -eq 2 ]; then
            echo "::error::${TF_ENV} does not run the new version. ECS probably rolled the deployment back. Look at the stopped tasks of the service."
          fi
          exit 1